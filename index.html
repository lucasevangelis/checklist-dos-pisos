<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
  <title>Checklist dos Pisos</title>
  <link rel="icon" href="assets/images/floor_icon.png" type="image/png" />

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div aria-live="polite" aria-atomic="true" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    <div id="toastMsg" class="toast" data-delay="2000">
      <div class="toast-body bg-info text-white">Mensagem de sucesso.</div>
    </div>
    <div id="toastError" class="toast" data-delay="3000">
        <div class="toast-body bg-danger text-white">Mensagem de erro.</div>
    </div>
  </div>

  <div id="splash" class="d-flex justify-content-center align-items-center">
    <div class="floor-advanced-logo">
      <div class="floor-stack"><div class="layer layer1"></div><div class="layer layer2"></div><div class="layer layer3"></div></div>
      <div class="check-bubble"><div class="bubble"><div class="check-stem"></div><div class="check-kick"></div></div></div>
    </div>
  </div>

  <div id="loginContainer" class="container-fluid mt-4 px-2 app-container" style="display: none;">
    <div class="card shadow-lg rounded tech-container mx-auto">
      <div class="card-body">
        <h2 class="card-title text-center text-light-tech mb-4"><i class="fas fa-sign-in-alt"></i> Acesse seu Checklist</h2>
        <form id="loginForm">
          <div class="form-group"><label for="username" class="text-light-tech">Usuário</label><input type="text" class="form-control" id="username" placeholder="Digite seu usuário" required /></div>
          <div class="form-group"><label for="password" class="text-light-tech">Senha</label><input type="password" class="form-control" id="password" placeholder="Digite sua senha" required /></div>
          <button type="submit" class="btn btn-tech btn-block"><i class="fas fa-user-check"></i> Entrar / Registrar</button>
        </form>
      </div>
    </div>
  </div>

  <div id="wizardContainer" class="container-fluid mt-4 px-2 app-container" style="display: none;">
    <div class="card shadow-lg rounded tech-container mx-auto">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
          <h2 class="text-light-tech text-center w-100 mb-0"><i class="fas fa-list-ul"></i> Adicionar ao Checklist</h2>
          <button id="logoutBtn" class="btn btn-danger btn-sm mt-2"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>

        <form id="wizardForm">
          <div class="wizard-step active" id="step1">
            <label for="wizDate" class="text-light-tech">Data</label>
            <input type="date" class="form-control mb-3" id="wizDate" required />
            <div class="invalid-feedback">A data é obrigatória.</div>
            <button type="button" class="btn btn-tech float-right" id="nextStep1">Próximo <i class="fas fa-arrow-right"></i></button>
          </div>
          <div class="wizard-step" id="step2" style="display: none;">
            <label for="wizPiso" class="text-light-tech">Piso</label>
            <select class="form-control mb-3" id="wizPiso"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            <button type="button" class="btn btn-secondary" id="backStep2"><i class="fas fa-arrow-left"></i> Voltar</button>
            <button type="button" class="btn btn-tech float-right" id="nextStep2">Próximo <i class="fas fa-arrow-right"></i></button>
          </div>
          <div class="wizard-step" id="step3" style="display: none;">
            <label for="wizPosicao" class="text-light-tech">Posição (somente números)</label>
            <input type="number" class="form-control mb-3" id="wizPosicao" placeholder="Ex: 101" />
            <div class="invalid-feedback">Apenas números são permitidos.</div>
            <button type="button" class="btn btn-secondary" id="backStep3"><i class="fas fa-arrow-left"></i> Voltar</button>
            <button type="button" class="btn btn-tech float-right" id="nextStep3">Próximo <i class="fas fa-arrow-right"></i></button>
          </div>
          <div class="wizard-step" id="step4" style="display: none;">
            <label for="wizObs" class="text-light-tech">Observação</label>
            <input type="text" class="form-control mb-3" id="wizObs" placeholder="Observação" />
            <button type="button" class="btn btn-secondary" id="backStep4"><i class="fas fa-arrow-left"></i> Voltar</button>
            <button type="button" class="btn btn-success-tech float-right" id="addEntryBtn"><i class="fas fa-check"></i> Adicionar ao Checklist</button>
          </div>
        </form>

        <hr class="my-4" style="border-color: rgba(255,255,255,0.2);" />

        <div class="table-responsive mt-2">
          <table class="table table-dark table-bordered" id="checklistTable">
            <thead class="thead-tech"><tr><th>Data</th><th>Piso</th><th>Posição</th><th>Observação</th><th>Ação</th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="emptyState" class="text-center p-4" style="display: none;">
            <i class="fas fa-clipboard-list fa-3x text-muted mb-2"></i>
            <h5 class="text-white-50">Seu checklist está vazio.</h5>
            <p class="text-muted">Adicione uma nova entrada no formulário acima para começar.</p>
          </div>
        </div>

        <hr class="my-4" style="border-color: rgba(255,255,255,0.2);" />
        <div class="text-center">
          <button id="generateExcel" class="btn btn-success-tech"><i class="fas fa-file-excel"></i> Gerar Excel</button>
          <button id="clearData" class="btn btn-warning btn-sm ml-2"><i class="fas fa-trash-alt"></i> Limpar Checklist</button>
          <button id="btnInicio" class="btn btn-info btn-sm ml-2"><i class="fas fa-home"></i> Início</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/script.js"></script>

  <div class="modal fade" id="confirmModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content tech-container"><div class="modal-header border-0"><h5 class="modal-title text-light-tech" id="confirmModalLabel">Confirmação</h5><button type="button" class="close text-white" data-dismiss="modal">&times;</button></div><div class="modal-body text-white"><p id="confirmModalBody"></p></div><div class="modal-footer border-0"><button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger" id="confirmModalConfirm">Confirmar</button></div></div></div></div>
</body>
</html>
